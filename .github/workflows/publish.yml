# Publishes the site, with a fresh copy of the public suggestions in data/suggestions.json so the map
# can show its dots without waiting on the Google Sheet. Runs on every push, whenever the sheet script
# reports a new pin or vote, and hourly as a safety net.
# GitHub pauses scheduled runs after 60 days without a commit, so the job commits when one is due.
name: Publish

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sheet-changed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The sheet is slow at random, so try it a few times. If it never answers, keep the copy
      # already on the site rather than publishing nothing.
      - name: Copy the public suggestions
        id: copy
        run: |
          sheet=$(grep -o "https://script.google.com[^']*" config.js)
          live=https://sharedmobilityalex.github.io/suggest/data/suggestions.json
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 90 "$sheet" -o fresh.json && jq -e 'type == "array"' fresh.json > /dev/null; then
              mv fresh.json data/suggestions.json
              break
            fi
            sleep 20
          done
          [ -f data/suggestions.json ] || curl -fsS --max-time 30 "$live" -o data/suggestions.json || echo '[]' > data/suggestions.json
          curl -fsS --max-time 30 "$live" -o published.json || echo 'none' > published.json
          if [ "${{ github.event_name }}" != push ] && cmp -s data/suggestions.json published.json; then
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f published.json

      - if: steps.copy.outputs.unchanged != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - if: steps.copy.outputs.unchanged != 'true'
        id: deployment
        uses: actions/deploy-pages@v5

      # An empty commit once the last one is 45 days old keeps the schedule from being paused.
      - name: Keep the schedule running
        if: github.event_name == 'schedule'
        run: |
          age=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          if [ "$age" -ge 45 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m 'Keep the scheduled publish running'
            git push || echo 'Push failed; the next run will try again.'
          else
            echo "Last commit is $age days old; nothing to do."
          fi
