<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suggest a location · City of Alexandria</title>
<meta name="description" content="Suggest a location for a Capital Bikeshare station or a bike and scooter parking corral in Alexandria, Virginia.">
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<header class="bar">
  <img class="lockup" src="assets/tes-logo.png" alt="City of Alexandria, Transportation and Environmental Services">
  <h1 data-s="title"></h1>
  <button type="button" class="bar-btn" id="lang"></button>
  <button type="button" class="bar-btn" id="help" data-s-label="help">?</button>
</header>

<main id="main">
  <div class="strip">
    <p class="tagline" id="tagline"></p>
    <div class="types" id="types">
      <label><input type="radio" name="type" value="station"><span class="swatch station"></span><span data-s="station" data-s-phone="stationShort"></span></label>
      <label><input type="radio" name="type" value="corral"><span class="swatch corral"></span><span data-s="corral" data-s-phone="corralShort"></span></label>
    </div>
    <div class="search">
      <input type="search" id="search" autocomplete="off" data-s="search" data-s-label="search">
      <ul id="results" hidden></ul>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="step" id="drop-step">
      <h2 data-s="step2"></h2>
      <p class="hint" id="hint"></p>
      <button type="button" class="btn" id="drop"></button>
    </div>
    <p class="near" id="near"></p>
    <div class="step">
      <h2 data-s="step3"></h2>
      <textarea id="note" maxlength="200" rows="3"></textarea>
    </div>
    <div class="actions">
      <button type="button" class="btn" id="cancel" data-s="cancel"></button>
      <button type="button" class="btn primary" id="submit" data-s="submit" disabled></button>
    </div>
    <ul class="legend">
      <li><span class="swatch existing-station"></span><span data-s="existingStation"></span></li>
      <li><span class="swatch existing-corral"></span><span data-s="existingCorral"></span></li>
      <li><span class="swatch station"></span><span data-s="suggested"></span></li>
    </ul>
    <p class="footer" data-s="footer"></p>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="crosshair"></div>
    <div class="rail">
      <button type="button" id="locate" data-s-label="locate">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
      <button type="button" id="zoom-in" data-s-label="zoomIn">+</button>
      <button type="button" id="zoom-out" data-s-label="zoomOut">−</button>
      <button type="button" id="basemap">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l8 4.5-8 4.5-8-4.5z"/><path d="M4 13l8 4.5 8-4.5"/></svg>
      </button>
    </div>
    <button type="button" class="btn primary cta" id="cta"></button>
    <p class="toast" id="toast" role="status"></p>
    <p class="credits" id="credits"></p>
  </div>
</main>

<dialog id="welcome">
  <h2 data-s="title"></h2>
  <p data-s="welcome"></p>
  <p class="ask" id="ask"></p>
  <div class="choices">
    <button type="button" class="btn" value="station" disabled><span class="swatch station"></span><span data-s="station"></span></button>
    <button type="button" class="btn" value="corral" disabled><span class="swatch corral"></span><span data-s="corral"></span></button>
  </div>
  <p class="remind" id="remind" role="alert" data-s="choose" hidden></p>
  <button type="button" class="link" id="welcome-lang"></button>
</dialog>

<dialog id="help-dialog">
  <h2 data-s="help"></h2>
  <ol>
    <li data-s="helpStep1"></li>
    <li data-s="helpStep2"></li>
    <li data-s="helpStep3"></li>
  </ol>
  <p data-s="helpVote"></p>
  <p data-s="helpPrivacy"></p>
  <p data-s="helpLinks"></p>
  <p class="links"><a href="https://www.alexandriava.gov/Bikesharing">Capital Bikeshare</a><a href="https://www.alexandriava.gov/DocklessMobility" data-s="dockless"></a></p>
  <button type="button" class="btn" id="help-close" data-s="close"></button>
</dialog>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" async id="gl"></script>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
